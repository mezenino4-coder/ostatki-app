name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller ostatki.spec --noconfirm

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag 2>$null
          gh release create v1.0.0 dist/*.exe --title "Остатки склада" --notes "Готовый exe для Windows (Python не нужен)."

      - name: Verify release is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view v1.0.0 --repo mezenino4-coder/ostatki-app --json isDraft,isPrerelease,assets --jq '{draft:.isDraft, pre:.isPrerelease, assets:(.assets|map(.name))}'
